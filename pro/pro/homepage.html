<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body>

<div class="container">

    <div class="row justify-content-center">

        <div class="col-lg-9">

            <div class="card">

                <div class="card-header">
                    <h2>🎓 Student Registration Form</h2>
                    <p class="mb-0">Fill all required details</p>
                </div>

                <div class="card-body p-4">

                    <form method="POST">

                        {% csrf_token %}

                        <!-- Personal Information -->

                        <h5>Personal Information</h5>

                        <div class="row">

                            <div class="col-md-6 mb-3">
                                <label class="form-label">First Name</label>
                                <input
                                    type="text"
                                    class="form-control"
                                    name="first_name"
                                    placeholder="Enter First Name"
                                    required>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label">Last Name</label>
                                <input
                                    type="text"
                                    class="form-control"
                                    name="last_name"
                                    placeholder="Enter Last Name"
                                    required>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label">Gender</label>

                                <select class="form-select" name="gender" required>

                                    <option value="">Select Gender</option>

                                    <option>Male</option>
                                    <option>Female</option>
                                    <option>Other</option>

                                </select>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label">Date of Birth</label>

                                <input
                                    type="date"
                                    class="form-control"
                                    name="date_of_birth"
                                    required>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label">Age</label>

                                <input
                                    type="number"
                                    class="form-control"
                                    name="age"
                                    min="1"
                                    max="100"
                                    placeholder="Enter Age"
                                    required>
                            </div>

                        </div>

                        <!-- Contact -->

                        <h5>Contact Information</h5>

                        <div class="row">

                            <div class="col-md-6 mb-3">

                                <label class="form-label">Email</label>

                                <input
                                    type="email"
                                    class="form-control"
                                    name="email"
                                    placeholder="example@gmail.com"
                                    required>

                            </div>

                            <div class="col-md-6 mb-3">

                                <label class="form-label">Phone Number</label>

                                <input
                                    type="tel"
                                    class="form-control"
                                    name="phone"
                                    placeholder="9876543210"
                                    maxlength="10"
                                    pattern="[0-9]{10}"
                                    oninput="this.value=this.value.replace(/[^0-9]/g,'').slice(0,10)"
                                    required>

                            </div>

                        </div>

                        <!-- Address -->

                        <h5>Address</h5>

                        <div class="mb-3">

                            <label class="form-label">Address</label>

                            <textarea
                                class="form-control"
                                rows="3"
                                name="address"
                                placeholder="Enter Full Address"
                                required></textarea>

                        </div>

                        <div class="row">

                            <div class="col-md-4 mb-3">

                                <label class="form-label">City</label>

                                <input
                                    type="text"
                                    class="form-control"
                                    name="city"
                                    required>

                            </div>

                            <div class="col-md-4 mb-3">

                                <label class="form-label">State</label>

                                <input
                                    type="text"
                                    class="form-control"
                                    name="state"
                                    required>

                            </div>

                            <div class="col-md-4 mb-3">

                                <label class="form-label">Country</label>

                                <input
                                    type="text"
                                    class="form-control"
                                    name="country"
                                    value="India"
                                    required>

                            </div>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">Pincode</label>

                            <input
                                type="text"
                                class="form-control"
                                name="pincode"
                                maxlength="6"
                                pattern="[0-9]{6}"
                                oninput="this.value=this.value.replace(/[^0-9]/g,'').slice(0,6)"
                                required>

                        </div>

                        <!-- Extra Details -->

                        <h5>Extra Details</h5>

                        <div class="row">

                            <div class="col-md-6 mb-3">

                                <label class="form-label">Blood Group</label>

                                <select
                                    class="form-select"
                                    name="blood_group">

                                    <option value="">Select</option>

                                    <option>A+</option>
                                    <option>A-</option>
                                    <option>B+</option>
                                    <option>B-</option>
                                    <option>AB+</option>
                                    <option>AB-</option>
                                    <option>O+</option>
                                    <option>O-</option>

                                </select>

                            </div>

                            <div class="col-md-6 mb-3">

                                <label class="form-label">Nationality</label>

                                <input
                                    type="text"
                                    class="form-control"
                                    name="nationality"
                                    value="Indian">

                            </div>

                        </div>

                        <!-- Status -->

                        <h5>Status</h5>

                        <div class="form-check mb-4">

                            <input
                                class="form-check-input"
                                type="checkbox"
                                name="is_active"
                                id="active">

                            <label
                                class="form-check-label"
                                for="active">

                                Active Student

                            </label>

                        </div>

                        <button
                            class="btn btn-primary w-100"
                            type="submit">

                            Save Student

                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
